# Local development only.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ratemate
      POSTGRES_USER: ratemate_user
      POSTGRES_PASSWORD: ${RATEMATE_DB_PASSWORD:?Set RATEMATE_DB_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-public-development-only-not-for-production-CHANGE-ME}
      RATEMATE_DB_PASSWORD: ${RATEMATE_DB_PASSWORD:?Set RATEMATE_DB_PASSWORD in root .env}
      RATEMATE_DB_HOST: db
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-ratemate@localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/csrf/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
  embeddings:
    build: ./backend
    command: python manage.py embed_templates --watch
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-public-development-only-not-for-production-CHANGE-ME}
      RATEMATE_DB_PASSWORD: ${RATEMATE_DB_PASSWORD:?Set RATEMATE_DB_PASSWORD in root .env}
      RATEMATE_DB_HOST: db
      EMBEDDING_CACHE_DIR: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./backend:/app
      - embedding_models:/models
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
  embedding_models:
