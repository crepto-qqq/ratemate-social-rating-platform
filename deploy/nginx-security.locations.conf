# Include inside a server block. The ACME challenge uses a ^~ location.
location ~ (^|/)\. {
    return 404;
}

location ~* ^/(backend|frontend|deploy|config|etc|proc|sys)(/|$) {
    return 404;
}

location ~* \.(py|pyc|pyo|sqlite|sqlite3|db|dump|sql|pem|key|ini|yaml|yml|toml|log|bak|map)(/|$) {
    return 404;
}

location ~* ^/media/.*\.(html?|svg|xml|js|mjs|css)(/|$) {
    return 404;
}
